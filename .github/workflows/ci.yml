name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: syntax
        run: |
          python3 -m py_compile sutra.py tests/toy_daemon.py tests/unit.py \
            tests/attack_socket.py
          bash -n tests/smoke.sh tests/check_version.sh vendor.sh
      - name: smoke
        run: make smoke
      - name: attack
        run: make attack
      - name: check-version
        run: make check-version
