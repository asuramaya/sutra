# pill-ci.yml -- the family's shared CI core, reusable via `on: workflow_call`
# rather than copied by hand. GitHub resolves the `uses:` reference at RUN
# TIME, so a fix landed here reaches every adopting pill's very next run
# with zero pill-side commits and no re-vendor wave -- the strongest of the
# three recipe-guard layers (sutra.mk is the second; see docs/ARCHITECTURE.md
# and docs/BOOTSTRAP.md). Covers the steps every pill shares; whatever is
# genuinely pill-specific (a bespoke lint exclusion list, an extra fuzz
# target) stays as a sibling job in the calling pill's own ci.yml -- this
# workflow was never meant to be literally everything.
#
# A pill's ci.yml becomes, at minimum:
#
#   jobs:
#     shared:
#       uses: asuramaya/sutra/.github/workflows/pill-ci.yml@<pinned-sha>
#       with:
#         python-files: "src/bin/coldspot src/bin/coldspotd"
#         shellcheck-files: "install.sh uninstall.sh tests/smoke.sh"
#         has-extension: true
#         extension-js: "src/extension/coldspot@asuramaya/extension.js"
#         # kast, which also has a prefs dialog, would instead pass:
#         #   extension-js: "src/extension/kast@asuramaya/extension.js src/extension/kast@asuramaya/prefs.js"
#         extension-metadata: "src/extension/coldspot@asuramaya/metadata.json"
#         man-pages: "src/data/man/man1/coldspot.1 src/data/man/man8/coldspotd.8"
#
# PILOT CORRECTIONS (Till, RAMstein, msg 2739 via Alfred): two gaps found by
# RAMstein's real pilot adoption, not by sutra validating this against
# itself or a fake pill built from the same head that authored it --
#
#   3. No shellcheck step existed at all, only `bash -n`. Any pill running
#      shellcheck today (most of them) would silently lose it on adoption
#      and have to keep a whole separate sibling job just for that one
#      check. Added below as a real, parameterized step.
#   4. run-check-version defaulted to true and called `make check-version`
#      -- a target NO PILL HAS. Checked all five: none define it. Worse,
#      it is not merely absent but actively wrong for a pill like RAMstein,
#      whose own check-repo enforces the OPPOSITE convention (a single
#      packaging/VERSION source of truth, no per-file literal at all) --
#      the exact thing check-version tests for. Adopting with defaults
#      would have hard-failed every pill's first CI run. Defaulted to
#      false; sutra itself is still the only real consumer.
#
# DEFECT 6 (maat, kast, msg 2787): extension-js checked only ONE file.
# Every pill has two .js files in its extension dir; for four of them the
# second is pill.js (covered separately via sutra.mk's SUTRA_EXT_DIR), but
# kast's second file is prefs.js, its settings dialog -- genuinely
# uncovered, and verbatim adoption would have silently dropped its syntax
# check. Same class as defect 1 (pill.js): any pill with a second entry
# point loses coverage silently. Fixed: extension-js takes a space-
# separated list, looped one `node --check` per file (measured: `node
# --check a.js b.js` is not "check both" -- node only validates the first
# positional argument as a script, anything after it becomes that script's
# own argv and is never parsed; a real syntax error in a second file would
# have exited 0 under a naive word-split fix, which is worse than the bug
# it replaces).
# Pin question, decided and documented per the ask rather than left
# implicit: PIN TO A COMMIT SHA, not @main and not a tag. Not @main --
# every adopting pill's CI would move the instant this file changes, with
# no propagation step and no way to catch a bad edit before it's live
# everywhere at once (exactly the uncontrolled blast radius Layer 3's own
# design deliberately avoids by needing an explicit PR per pill). Not a
# tag either, at least not yet -- sutra cuts no tagged release until sutra
# and mudra converge (operator ruling; docs/RELEASING.md), so there is no
# tag to pin to today. A commit SHA gives the same immutability and control
# a tag would, works right now, and should move to tag-pinning once sutra
# starts cutting releases (revisit then, not before).

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      python-files:
        description: Space-separated files for `python3 -m py_compile`. Empty skips the step.
        type: string
        default: ""
      shell-files:
        description: Space-separated files for `bash -n`. Empty skips the step.
        type: string
        default: ""
      shellcheck-files:
        description: Space-separated files for shellcheck. Empty skips the step.
        type: string
        default: ""
      shellcheck-exclude:
        description: >-
          Comma-separated SC codes passed as `-e`, e.g. "SC2155,SC1090" --
          not `--rcfile`, which only exists from shellcheck 0.11.0 and
          ubuntu-latest ships older. Empty passes no exclusions.
        type: string
        default: ""
      has-extension:
        description: Whether this pill ships a GNOME Shell extension.
        type: boolean
        default: false
      extension-js:
        description: >-
          Space-separated .js files to syntax-check with `node --check`
          (required if has-extension) -- every file in the extension dir
          that ships as its own script, not just extension.js. A pill
          with a prefs dialog (kast's prefs.js) or any other second entry
          point needs it listed here too, or it silently loses coverage.
        type: string
        default: ""
      extension-metadata:
        description: Path to the extension's metadata.json. Empty skips the JSON-validity check.
        type: string
        default: ""
      man-pages:
        description: Space-separated man page paths, checked with groff -t -k -man -Tutf8 -ww. Empty skips the step.
        type: string
        default: ""
      run-check-sutra:
        type: boolean
        default: true
      run-smoke:
        type: boolean
        default: true
      run-attack:
        type: boolean
        default: false
      run-check-version:
        description: >-
          Runs `make check-version` if true. Defaults to false: no pill
          defines that target today, and some (RAMstein) enforce the
          opposite convention on purpose. See PILOT CORRECTIONS above.
        type: boolean
        default: false
      run-signing-verify:
        description: >-
          Gates the release-signing verify step. Requires
          signing-verify-command to be set to something non-empty when
          true -- there is no default command, see that input's own
          description for why.
        type: boolean
        default: false
      signing-verify-command:
        description: >-
          DEFECT 8 (Aegis, msg 2848 via Alfred): this used to be
          hardcoded as `bash tests/test_signing.sh`. Measured across the
          family, that path is wrong for half of the pills that have a
          signing test at all -- coldspot and phanspeed use
          tests/test_signing.py, not .sh, and both were locked out of
          this shared step, hand-rolling a sibling job instead. Same
          shape as defect 5 (SUTRA_CHECK_BIN): a hardcoded guess wrong
          for a large minority is not a shortcut, it is silent opt-out
          pressure on exactly the pills the shared step was supposed to
          cover. No default here either, and no .py-vs-.sh special
          casing -- that would just be a cleverer guess, the same trap.
          Set this to the pill's actual command in full, e.g.
          "bash tests/test_signing.sh" or "python3
          tests/test_signing.py" or anything else; pill-ci.yml never
          needs to know the taxonomy. Ignored when run-signing-verify is
          false.
        type: string
        default: ""

jobs:
  shared:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # First, before anything below can create a build/dist artifact that
      # would otherwise trip the row-count check for the wrong reason
      # (REPO-STANDARD.md: order the structure gate before any build step).
      - name: Repo structure gate (REPO-STANDARD.md)
        run: make check-repo

      # DEFECT 7 (Till, RAMstein, and independently tjmax, msg 2791 via
      # Alfred): every step below used to gate with a step-level `if:`.
      # GitHub Actions marks a gated-off step `conclusion: skipped` --
      # accurate, but INVISIBLE in `gh run view`'s default summary, which
      # renders job-level checkmarks only. Till's run-attack was false
      # from his first pilot commit onward; he ran attack by hand every
      # time (it passed) and CI was green every time, and neither signal
      # said the check had not actually run in CI. He only found it via
      # `gh api .../jobs/<id> --jq '.steps[]'`, reading conclusion
      # directly; tjmax hit the identical wall independently the same
      # morning. Generalizes defects 3/4/6 rather than sitting beside
      # them -- ANY gated step has this shape, current and future.
      #
      # Alfred's explicit instruction: do not "fix" this by changing a
      # default -- no boolean is right for every pill (run-attack: true
      # would fail phanspeed, which genuinely cannot run it in CI; false
      # is wrong for the four pills that can). The defect is that the
      # skip is silent, not that any particular default is wrong.
      #
      # Fixed by removing every step-level `if:` and moving the decision
      # inside the step, in TWO places at once: the step's own NAME grows
      # a "-- SKIPPED (reason)" suffix via a name-level expression
      # (evaluated before the run, so it renders in the exact summary
      # view that was blind before), and the run script echoes the same
      # decision for anyone reading the full log. A step that's gated off
      # now always shows conclusion: success with a name and an output
      # line that both say so, instead of vanishing.

      - name: Python (syntax)${{ inputs.python-files == '' && ' -- SKIPPED (python-files not set)' || '' }}
        run: |
          if [ -n "${{ inputs.python-files }}" ]; then
            python3 -m py_compile ${{ inputs.python-files }}
          else
            echo "python (syntax): SKIPPED (python-files not set)"
          fi

      - name: Shell (syntax)${{ inputs.shell-files == '' && ' -- SKIPPED (shell-files not set)' || '' }}
        run: |
          if [ -n "${{ inputs.shell-files }}" ]; then
            bash -n ${{ inputs.shell-files }}
          else
            echo "shell (syntax): SKIPPED (shell-files not set)"
          fi

      - name: Shellcheck${{ inputs.shellcheck-files == '' && ' -- SKIPPED (shellcheck-files not set)' || '' }}
        run: |
          if [ -n "${{ inputs.shellcheck-files }}" ]; then
            shellcheck ${{ inputs.shellcheck-exclude != '' && format('-e {0}', inputs.shellcheck-exclude) || '' }} ${{ inputs.shellcheck-files }}
          else
            echo "shellcheck: SKIPPED (shellcheck-files not set)"
          fi

      - name: Sutra vendor drift guard${{ inputs.run-check-sutra == false && ' -- SKIPPED (run-check-sutra is false)' || '' }}
        run: |
          if [ "${{ inputs.run-check-sutra }}" = "true" ]; then
            make check-sutra
          else
            echo "check-sutra: SKIPPED (run-check-sutra is false)"
          fi

      # `node --check a.js b.js` is NOT "check both" -- node only
      # validates the first positional argument as a script; anything
      # after it becomes that script's own argv and is never parsed at
      # all. Measured: a real syntax error in a second file exits 0.
      # Loop instead, one `node --check` per file.
      #
      # PLAIN `node --check <path>` ON A .js FILE VALIDATES NOTHING (Till,
      # verified by Alfred, msg 3410): every pill's extension.js/pill.js is
      # an ES module by construction, but a bare `.js` `--check` neither
      # requires nor reliably parses module syntax -- measured against a
      # deliberately broken fixture, `node --check broken.js` exits 0 on
      # garbage a human would reject on sight. `node --check broken.mjs`
      # and `node --input-type=module --check < broken.js` both correctly
      # exit 1. This step has never validated a single character of GJS in
      # any pill, in any repo, ever -- the loop fix above was real and
      # correctly diagnosed; the command inside the loop was never checking
      # anything, one question short. Fixed with the stdin form over the
      # temp-file/.mjs-copy form used ad hoc in byebyte's Makefile and
      # hector-vector's ci.yml: no cleanup path to get wrong. The `echo`
      # before each check exists because node's stdin-mode error names the
      # file "[stdin]", not the real path, and this step's own default
      # shell runs with -e -- the first failure ends the loop, so the log
      # line right above it is the only place the real filename survives.
      # Re-verified against real extension.js/pill.js/prefs.js from
      # byebyte, kast and coldspot before landing -- all pass clean, no
      # false-positive risk from the stricter parse.
      - name: GNOME extension (syntax)${{ inputs.has-extension == false && ' -- SKIPPED (has-extension is false)' || '' }}
        run: |
          if [ "${{ inputs.has-extension }}" = "true" ]; then
            for f in ${{ inputs.extension-js }}; do
              echo "checking $f"
              node --input-type=module --check < "$f"
            done
          else
            echo "extension (syntax): SKIPPED (has-extension is false)"
          fi

      - name: GNOME extension metadata (valid JSON)${{ (inputs.has-extension == false || inputs.extension-metadata == '') && ' -- SKIPPED (has-extension is false, or extension-metadata not set)' || '' }}
        run: |
          if [ "${{ inputs.has-extension }}" = "true" ] && [ -n "${{ inputs.extension-metadata }}" ]; then
            python3 -c "import json; json.load(open('${{ inputs.extension-metadata }}'))"
          else
            echo "extension metadata (valid JSON): SKIPPED (has-extension is false, or extension-metadata not set)"
          fi

      # -t -k, not just -Tutf8 -ww: the bare form exits 0 while silently
      # skipping the table and UTF-8 preprocessor passes, so a malformed
      # table would render clean (family hardening, Alfred msg 1628).
      - name: man page (syntax)${{ inputs.man-pages == '' && ' -- SKIPPED (man-pages not set)' || '' }}
        run: |
          if [ -n "${{ inputs.man-pages }}" ]; then
            groff -t -k -man -Tutf8 -ww ${{ inputs.man-pages }} > /dev/null
          else
            echo "man page (syntax): SKIPPED (man-pages not set)"
          fi

      - name: Smoke${{ inputs.run-smoke == false && ' -- SKIPPED (run-smoke is false)' || '' }}
        run: |
          if [ "${{ inputs.run-smoke }}" = "true" ]; then
            make smoke
          else
            echo "smoke: SKIPPED (run-smoke is false)"
          fi

      - name: Attack (adversarial fuzz)${{ inputs.run-attack == false && ' -- SKIPPED (run-attack is false)' || '' }}
        run: |
          if [ "${{ inputs.run-attack }}" = "true" ]; then
            make attack
          else
            echo "attack: SKIPPED (run-attack is false)"
          fi

      - name: Check-version${{ inputs.run-check-version == false && ' -- SKIPPED (run-check-version is false)' || '' }}
        run: |
          if [ "${{ inputs.run-check-version }}" = "true" ]; then
            make check-version
          else
            echo "check-version: SKIPPED (run-check-version is false)"
          fi

      - name: Release-signing verify path${{ inputs.run-signing-verify == false && ' -- SKIPPED (run-signing-verify is false)' || '' }}
        run: |
          if [ "${{ inputs.run-signing-verify }}" = "true" ]; then
            if [ -z "${{ inputs.signing-verify-command }}" ]; then
              echo "signing-verify FAIL: run-signing-verify is true but signing-verify-command is empty -- set it to this pill's actual command (e.g. \"bash tests/test_signing.sh\" or \"python3 tests/test_signing.py\"); no default is guessed, see the input's own description"
              exit 1
            fi
            ${{ inputs.signing-verify-command }}
          else
            echo "signing-verify: SKIPPED (run-signing-verify is false)"
          fi
